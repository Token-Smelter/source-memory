# Neo4j for Source Memory plus the CLI image.
#   create .env containing NEO4J_PASSWORD=<long random password> (git-ignored)
#   docker compose up -d neo4j
#   docker compose run --rm memory init --scope default
# Neo4j is published on 127.0.0.1 only, for host-side CLI use with config/host.json.
services:
  neo4j:
    image: neo4j:5.26.14-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30

  memory:
    build: .
    profiles: ["cli"]
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      SOURCE_MEMORY_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    volumes:
      - ./config/docker.json:/app/config/docker.json:ro

volumes:
  neo4j-data:
